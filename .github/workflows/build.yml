name: Windows 試用版建置

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.400'
      - name: 檢查新手文件連結與文字格式
        shell: pwsh
        run: python tests/check_public_docs.py
      - name: 建置、檢查資源、執行隔離測試並打包
        shell: pwsh
        run: ./tests/build_public.ps1
      - name: 保留試用包與驗證結果
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CodexUsageMonitor-windows-x64-candidate
          path: |
            artifacts/beta-0.5.0/*/*.zip
            artifacts/beta-0.5.0/*/SHA256SUMS.txt
            artifacts/beta-0.5.0/*/build-result.json
            artifacts/beta-0.5.0/*/test-summary.json
            artifacts/beta-0.5.0/*/release-audit.json
          if-no-files-found: error
          retention-days: 7
