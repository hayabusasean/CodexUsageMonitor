name: 問題回報
description: 告訴我們按了什麼、遇到什麼情況，不需要懂程式。
title: "[問題] "
body:
  - type: markdown
    attributes:
      value: |
        請先看首頁的新手教學。不要附上密碼、金鑰、登入檔、設定檔、完整歷史或公司資料。
        可從「關於 → 複製問題摘要」先預覽再分享；截圖也請遮掉私人資訊。
        疑似資料外洩或安全漏洞，請走私密管道：
        https://github.com/hayabusasean/CodexUsageMonitor/security/advisories/new
  - type: input
    id: monitor_version
    attributes:
      label: 工具版本
      description: 可以在「關於」查看。
      placeholder: 例如 0.5.0-beta4
    validations:
      required: true
  - type: input
    id: windows_version
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11；不知道可填「不確定」。
    validations:
      required: true
  - type: input
    id: display_scale
    attributes:
      label: 畫面縮放比例（選填）
      description: 畫面有裁切或字太小時再提供，不知道可以留白。
      placeholder: 例如 100% 或 150%
  - type: input
    id: codex_version
    attributes:
      label: 官方 Codex 版本（選填）
      description: 不知道可以留白，不必尋找私人檔案。
  - type: textarea
    id: what_happened
    attributes:
      label: 你按了什麼？出現什麼問題？
      description: 用自己的話簡單描述即可。
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: 你原本希望發生什麼？
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: 截圖或問題摘要（選填）
      description: 分享前先檢查私人資訊，不要附整包紀錄。
